<title>Страницы услуг: 44 макета</title>

<style>

}

    --bg:#0c1320; --bg2:#111a2b; --ink:#eef2f8; --ink2:#c8d1de; --mute:#8b98ad; --line:#24324a;
    --brand:#7ea2ff; --brand2:#5f8bff; --brand-soft:#182746; --navy:#060c18; --navy2:#0f1d38; --card:#131e30; --shadow:none;
  }
}
:root[data-theme="dark"]{

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,Arial,sans-serif}
h1,h2,h3{font-family:Jura,"Trebuchet MS",Arial,sans-serif;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,3vw,42px);line-height:1.08;font-weight:700}
h2{font-size:clamp(22px,2vw,30px);line-height:1.15;font-weight:700}
h3{font-size:18px;font-weight:700;line-height:1.3}
p{margin:0}a{color:var(--brand);text-decoration:none}img{display:block;max-width:100%}

.side .brand{font:700 13px/1 Jura,sans-serif;letter-spacing:.14em;background:#0f172a;color:#fff;padding:11px 16px;border-radius:999px;display:inline-flex;gap:8px;align-items:center;margin:4px 6px 6px}

.side .hint{font-size:12px;color:var(--mute);margin:0 8px 6px;line-height:1.45}
main{min-width:0}

nav.main{display:flex;gap:26px;font:700 16px/1 Jura,sans-serif}

.search{margin-left:auto;border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:var(--mute);font-size:14px;min-width:200px}

.hero .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:start}

.step{position:relative;display:grid;justify-items:center;text-align:center;padding:0 10px}
.step .when{position:absolute;top:-30px;font:800 10.5px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);background:var(--bg);border:1px solid var(--brand-soft);border-radius:999px;padding:6px 10px;white-space:nowrap}
.step .ic{width:72px;height:72px;border-radius:50%;background:var(--bg);border:4px solid var(--brand);color:var(--brand);display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 10px 24px -12px rgba(29,78,216,.5)}

.step.last .ic{background:var(--brand);color:#fff}.step.last .ic i{background:#0f172a}
.step b{display:block;font-family:Jura,sans-serif;font-size:17px;margin-top:18px;line-height:1.2}
.step span{display:block;font-size:13.5px;color:var(--mute);line-height:1.5;margin-top:6px;max-width:22ch}

.brands{color:var(--ink2);margin-top:12px;max-width:70ch}
.catlink{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:12px 18px;color:var(--ink)}
.details{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 44px;margin-top:24px}
.details p{color:var(--ink2)}
.details h3{margin-bottom:8px}
.faq{display:grid;gap:10px;margin-top:24px;max-width:860px}
.faq details{border:1px solid var(--line);border-radius:14px;padding:0 20px;background:var(--card)}
.faq summary{cursor:pointer;list-style:none;padding:15px 0;font-weight:700;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}

.faq details p{padding:0 0 15px;color:var(--ink2)}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.case{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.case .cph{height:140px;background:linear-gradient(135deg,var(--navy2),var(--brand2))}
.case .b{padding:14px 16px}.case .b b{display:block;font-size:15px}.case .b span{font-size:13px;color:var(--mute)}
.revs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
.rev{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--bg2)}
.rev .who{display:flex;justify-content:space-between;font-weight:700;font-size:14px}.rev .who span{color:#f59e0b;letter-spacing:2px}
.rev p{color:var(--ink2);font-size:14.5px;margin-top:6px}
.ind{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.ind .c{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--card)}
.ind .c b{display:block;font-family:Jura,sans-serif;font-size:16px;margin-bottom:6px}
.ind .c p{font-size:14px;color:var(--ink2)}
.dark{background:var(--navy);color:#fff}.dark .eyebrow{color:#67e8f9}.dark h2{color:#fff}

.final .grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.final .eyebrow{color:#93c5fd}.final h2{color:#fff}.final p{color:#cbd5e1;margin-top:14px;max-width:48ch}

.form .btn{background:#1d4ed8;color:#fff;font-weight:800;text-align:center;padding:15px;border-radius:12px;font-size:16px}
.form small{color:#64748b;font-size:12.5px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:22px 0 30px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.chips .l{border:0;color:var(--mute);padding-left:0;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;align-self:center}
@media (max-width:1100px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;max-height:40vh}.hero .grid,.ihero .grid,.pricegrid,.final .grid,.details,.revs{grid-template-columns:1fr}.tiles,.tiles.n4,.tiles.n3,.pkgs,.route,.route.n4,.route.n6,.cases,.ind,.stats{grid-template-columns:1fr 1fr}.route:before{display:none}.cols2{columns:1}nav.main,.search{display:none}.step .when{position:static;margin-bottom:8px}}

/* compact process strip */
.mini{margin-top:0;border:1px solid var(--line);border-radius:18px;background:var(--bg2);padding:18px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.mini .lbl{font:800 11px/1.3 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);max-width:12ch}
.mini ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}
.mini ol:before{content:"";position:absolute;left:10%;right:10%;top:15px;height:2px;background:var(--line)}
.mini li{display:grid;justify-items:center;text-align:center;gap:8px;position:relative;font:700 13px/1.25 Jura,sans-serif;color:var(--ink)}
.mini li i{width:30px;height:30px;border-radius:50%;background:var(--bg);border:2px solid var(--brand);color:var(--brand);font:700 12px/26px Jura,sans-serif;font-style:normal;text-align:center;position:relative;z-index:1}
.mini li:last-child i{background:var(--brand);color:#fff}
.mini li small{display:block;font:500 11.5px/1.3 Inter,sans-serif;color:var(--mute)}
.mini a{font-weight:700;font-size:13.5px;white-space:nowrap}
@media (max-width:1000px){.mini{grid-template-columns:1fr}.mini ol{grid-template-columns:repeat(5,1fr)}.mini ol:before{display:none}}
</style>

function priceLine(p, i, name){
  if (p.key==='cctv') return ['от 4 000 000 сум','от 4 000 000 сум','от 7 500 000 сум'][i];
  if (p.kitsPrices?.length && /офис/i.test(name||'')) return 'от '+p.kitsPrices[0].toLocaleString('ru-RU').replace(/,/g,' ')+' сум';
  return null;
}
function renderService(p){
  const c = p.content;
  const paras = c?.paragraphs ?? [];
  const first = paras.slice(0,2), rest = paras.slice(2);
  const works = (p.works||[]).slice(0,6);
  const tilesCls = works.length===4?'n4':works.length===3?'n3':works.length===6?'n6':'';
  const hero = heroFor(p.key);
  const d = p.details||{};
  const pk = (d.packages||[]).slice(0,3);
  const st = (d.stages||[]).slice(0,6);
  const isCctv = p.key==='cctv';
  const whens = isCctv?['День обращения','1–2 дня','1–3 дня','В день монтажа','Сдача']:st.map((_,i)=>'Шаг '+(i+1));
  return `
  <section class="hero"><div class="wrap">
    <div class="crumbs">Главная &nbsp;/&nbsp; Услуги &nbsp;/&nbsp; <b>${esc(p.title)}</b></div>
    <div class="grid"><div><div class="eyebrow">Услуга</div><h1>${esc(p.h1)}</h1><p class="lead">${esc(p.intro)}</p></div>
    ${hero?`<img class="ph" src="${hero}" alt="">`:`<div class="phx">${ICONS[4]}<em>фото услуги: services-page/${esc(p.key)}.jpg</em></div>`}</div>
  </div></section>
  ${c?`<section>${tag('Что это',`<h2>${esc(c.heading)}</h2><div class="cols2">${first.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`)}</section>`:
       `<section>${tag('Что это',`<h2>${esc(p.title)}</h2><p class="lead" style="margin-top:14px;color:var(--ink2)">${esc(p.desc)}</p>`)}</section>`}
  ${works.length?`<section>${tag('Что входит',`<h2>Состав работ</h2><div class="tiles ${tilesCls}">${works.map((w,i)=>{const [t,...r]=w.split(/[:—–,]/);return `<div class="tile"><em>0${i+1}</em><div class="ic">${ICONS[i%ICONS.length]}</div><b>${esc(t.trim())}</b>${r.length?`<span style="font-size:13.5px;color:var(--mute)">${esc(r.join(',').trim())}</span>`:''}</div>`}).join('')}</div>`)}</section>`:''}
  ${pk.length?`<section>${tag('Сколько стоит',`<h2>${esc(d.pkgTitle||'Типовые решения')}</h2><div class="pkgs">${pk.map((x,i)=>{const cov=covFor(p.key,i);const pr=priceLine(p,i,x.name);return `<div class="pkg">${cov?`<img class="cov" src="${cov}" alt="">`:`<div class="covx" style="background:${GRAD[i%3]}">${esc(x.name)}</div>`}<div class="body"><h3>${esc(x.name)}</h3><span class="for">${esc(x.for||'')}</span><span class="price ${pr?'':'req'}">${pr||'Цена по расчёту после осмотра'}</span><ul>${(x.items||[]).slice(0,4).map(it=>`<li>${esc(it)}</li>`).join('')}</ul>${x.term?`<span class="term">${esc(x.term)}</span>`:''}</div></div>`}).join('')}</div>
    <div class="pricegrid"><div class="pricenote"><p>${esc(d.pkgNote||'')}</p>${paras[2]?`<p style="margin-top:12px">${esc(paras[2])}</p>`:''}<p style="margin-top:12px"><a href="#">Рассчитать смету →</a></p></div>
    ${p.prices?`<div class="pricetable"><div><span>Оборудование из каталога</span><span>Цена</span></div>${p.prices.rows.map(r=>`<div><span>${esc(r.label)}</span><b>${esc(r.price)}</b></div>`).join('')}</div>`:`<div class="pricetable"><div><span>Оборудование из каталога</span><span>Цена</span></div><div><span style="color:var(--mute)">Таблица цен на оборудование: добавить из каталога по типу</span></div></div>`}</div>`)}</section>`:''}
  
  ${d.brandsText?`<section>${tag('Оборудование',`<h2>${esc(d.brandsTitle||'Оборудование')}</h2><p class="brands">${esc(d.brandsText)}</p><a class="catlink" href="#">Смотреть в каталоге →</a>`)}</section>`:''}
  ${rest.length>(paras[2]?1:0)?`<section>${tag('Подробно',`<h2>Что важно знать до договора</h2><div class="details">${rest.slice(paras[2]?1:0).map(x=>`<div><p>${esc(x)}</p></div>`).join('')}</div>`)}</section>`:''}
  ${p.faq.length?`<section>${tag('Вопросы',`<h2>Частые вопросы</h2><div class="faq">${p.faq.map((f,i)=>`<details ${i===0?'open':''}><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}</div>`)}</section>`:''}
  ${st.length?`<section style="padding-top:0;border-top:0"><div class="wrap"><div class="mini"><div class="lbl">Как проходит работа</div><ol>${st.slice(0,5).map((s,i)=>`<li><i>${i+1}</i>${esc(s.t)}${isCctv?`<small>${esc(whens[i])}</small>`:''}</li>`).join('')}</ol><a href="#">Подробно о том, как мы работаем →</a></div></div></section>`:''}
  ${proof(p)}
  ${finalBlock(p)}`;
}
function renderIndustry(p){
  const hero = heroFor(p.key); const S = D.industryStats||{};
  const ind = p.industry||{}; const d=p.details||{}; const pk=(d.packages||[]).slice(0,3); const st=(d.stages||[]).slice(0,6);
  const card = arr => `<div class="ind">${(arr||[]).map(x=>`<div class="c"><b>${esc(x.title)}</b><p>${esc(x.text)}</p></div>`).join('')}</div>`;
  const faq = ind.faq?.length?ind.faq:p.faq;
  return `
  <section class="ihero" style="padding-bottom:0"><div class="wrap">
    <div class="crumbs">Главная &nbsp;/&nbsp; Услуги &nbsp;/&nbsp; <b>${esc(p.title)}</b></div>
    <div class="grid"><div><div class="eyebrow">Решение для отрасли</div><h1>${esc(p.h1)}</h1><p class="lead">${esc(p.intro)}</p></div>
    ${hero?`<img class="ph" src="${hero}" alt="" style="border-color:rgba(255,255,255,.15)">`:`<div class="phx">${ICONS[1]}<em>фото отрасли: services-page/${esc(p.key)}.jpg</em></div>`}</div>
    <div class="stats">${['s1','s2','s3','s4'].map(k=>`<div><b>${esc(S[k]?.v||'')}</b><span>${esc(S[k]?.l||'')}</span></div>`).join('')}</div>
  </div></section>
  ${ind.specifics?`<section>${tag('Специфика объекта',`<h2>${esc(ind.specificsTitle||'Специфика объекта')}</h2>${card(ind.specifics)}`)}</section>`:''}
  ${pk.length?`<section>${tag('Что ставим',`<h2>${esc(d.pkgTitle||'Типовые решения')}</h2><div class="pkgs">${pk.map((x,i)=>{const cov=covFor(p.key,i);return `<div class="pkg">${cov?`<img class="cov" src="${cov}" alt="">`:`<div class="covx" style="background:${GRAD[i%3]}">${esc(x.name)}</div>`}<div class="body"><h3>${esc(x.name)}</h3><span class="for">${esc(x.for||'')}</span><span class="price req">Смета после осмотра объекта</span><ul>${(x.items||[]).slice(0,4).map(it=>`<li>${esc(it)}</li>`).join('')}</ul>${x.term?`<span class="term">${esc(x.term)}</span>`:''}</div></div>`}).join('')}</div>`)}</section>`:''}
  ${ind.workflow?`<section>${tag('Как ведём проект',`<h2>${esc(ind.workflowTitle||'Как ведём проект')}</h2><div class="proc"><div class="route ${ind.workflow.length===4?'n4':ind.workflow.length===6?'n6':''}">${ind.workflow.map((s,i)=>`<div class="step ${i===ind.workflow.length-1?'last':''}"><span class="when">Шаг ${i+1}</span><div class="ic"><i>${i+1}</i>${PROC[i%PROC.length]}</div><b>${esc(s.title)}</b><span>${esc(s.text)}</span></div>`).join('')}</div></div>`)}</section>`:''}
  ${ind.pitfalls?`<section class="dark">${tag('Сложности и решения',`<h2>${esc(ind.pitfallsTitle||'Сложности и решения')}</h2>${card(ind.pitfalls)}`)}</section>`:''}
  ${p.industryServices?.length?`<section>${tag('Профильные услуги',`<h2>Что входит в проект</h2><div class="tiles ${p.industryServices.length>=5?'':'n4'}">${p.industryServices.slice(0,6).map((k,i)=>`<div class="tile"><div class="ic">${ICONS[i%ICONS.length]}</div><b>${esc(byKey[k]?.title||k)}</b><span style="font-size:13.5px;color:var(--mute)">${esc(byKey[k]?.desc||'')}</span></div>`).join('')}</div>`)}</section>`:''}
  ${faq?.length?`<section>${tag('Вопросы',`<h2>Частые вопросы</h2><div class="faq">${faq.map((f,i)=>`<details ${i===0?'open':''}><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}</div>`)}</section>`:''}
  ${proof(p)}
  ${finalBlock(p,true)}`;
}

   <div class="case"><div class="cph"></div><div class="b"><b>Uzum: распределительный центр</b><span>54 камеры, архив 56 ТБ</span></div></div>

}

   <div class="contacts"><b>+998 97 862 66 99</b><span>Пн–Пт 9:00–18:00 · sales@satsolutions.uz</span><span>Ташкент, ул. Катта Дархон, 5</span><div class="msgs"><span>Telegram</span><span>WhatsApp</span></div></div></div>
   <div class="form"><h3>Получить КП</h3><div class="f">Имя</div><div class="f">Телефон</div><div class="f ta">Объект: адрес или описание задачи</div><div class="btn">Получить КП</div><small>Нажимая кнопку, вы соглашаетесь на обработку данных</small></div></div></div></section>
   <div class="wrap chips">${arts.length?`<span class="l">Статьи</span>${arts.map(a=>`<span>${esc(a.title)}</span>`).join('')}`:''}${p.industryServices?.length?`<span class="l">Услуги</span>${p.industryServices.slice(0,4).map(k=>`<span>${esc(byKey[k]?.title||k)}</span>`).join('')}`:''}</div>`;
}
function show(key){
  const p = byKey[key]||P[0];
  document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('on',b.dataset.k===p.key));
  document.getElementById('main').innerHTML = `
   <div class="mocktag"><div class="wrap"><span>Макет · satsolutions.uz/solutions/${esc(p.key)}</span><span>${p.group==='industry'?'отрасль':'услуга'} · новый порядок блоков</span></div></div>
   <header class="top"><div class="wrap"><nav class="main"><span>Главная</span><span class="dd">Услуги</span><span class="dd">Каталог</span><span class="dd">Портфолио</span><span>О компании</span></nav><div class="search">Поиск: камера, пожарка…</div><div class="lang">RU ⌄</div></div></header>
   ${p.group==='industry'?renderIndustry(p):renderService(p)}`;
  document.getElementById('main').scrollIntoView({block:'start'});
  history.replaceState(null,'','#'+p.key);
}
for (const g of ['service','industry']){
  const box = document.getElementById(g==='service'?'navS':'navI');
  box.innerHTML = P.filter(p=>p.group===g).map(p=>`<button data-k="${p.key}">${esc(p.title)}</button>`).join('');
}
document.querySelectorAll('.side button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.k)));
show((location.hash||'#access').slice(1));
</script>
