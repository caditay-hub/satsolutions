# 20.11.2026. Один раз на браузер стереть HTTP-кэш сайта satsolutions.uz.
# Причина: до 19.11.2026 Next отдавал страницам и предзагрузкам ссылок (RSC) Cache-Control
# «stale-while-revalidate» на год, и браузеры посетителей хранят ответы прежних сборок. Вернувшийся
# посетитель получает смесь прежней и новой сборки → «reading 'call'» (Sentry WEB-D…M, 51 событие за
# сутки после правки nginx 19.11). Заголовок Clear-Site-Data: "cache" стирает этот кэш (Chrome, Edge,
# Firefox, Safari 17+); cookie sat_csd на 30 дней — чтобы не стирать его при каждом заходе.
# Только для HTML-документов (Accept: text/html), не для RSC и API. Подключено в sites-enabled/satsolutions, location /.
map "$cookie_sat_csd|$http_accept" $sat_csd_header {
    default            "";
    "~^\|.*text/html"  "\"cache\"";
}
map "$cookie_sat_csd|$http_accept" $sat_csd_cookie {
    default            "";
    "~^\|.*text/html"  "sat_csd=1; Path=/; Max-Age=2592000; SameSite=Lax; Secure";
}
